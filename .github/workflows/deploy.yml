name: Xtara MVP CI/CD

on:
  pull_request:
    branches: [xtara-mvp]
  push:
    branches: [xtara-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xtara-web-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Web quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Test deployment failure and rollback handling
        run: node --test scripts/ci-release.test.mjs
      - name: Production build
        run: npm run build
      - name: Preserve coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: coverage/
          retention-days: 7

  deploy:
    name: Deploy verified MVP
    needs: verify
    if: github.ref == 'refs/heads/xtara-mvp' && github.event_name != 'pull_request' && vars.XTARA_MVP_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: xtara-mvp
      url: https://xtara.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate dedicated deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: bigmints-xtara
          credentials_json: ${{ secrets.GCP_DEPLOYER_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure image registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet
      - name: Build, verify candidate, promote and verify live release
        run: node scripts/run-with-gcp-secrets.mjs -- node scripts/ci-release.mjs
      - name: Preserve release and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.run_id }}
          path: release-evidence.json
          if-no-files-found: warn
          retention-days: 30
